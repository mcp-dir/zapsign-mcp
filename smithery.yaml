# Smithery configuration for ZapSign
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_zapsign

name: zapsign-mcp
displayName: "ZapSign"
description: >
  Assinatura eletrônica de documentos ZapSign via API oficial: criar documentos para assinatura (de PDF, DOCX, URL ou template), acompanhar status, gerenciar signatários e autenticação, templates, webhooks, verificação de antecedentes e plano da conta. Gere seu API Token no painel em Configurações → Integrações → ZAPSIGN API.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/zapsign-mcp
repository: https://github.com/mcp-dir/zapsign-mcp

tags:
  - zapsign
  - brazil
  - legal
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_zapsign

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_zapsign/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
